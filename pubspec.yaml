name: multimidiaapp
description: "Aplicativo para gerenciamento de orçamentos empresariais"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.14+17

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  
  # Core Libraries (Obrigatórias)
  flutter_modular: ^5.0.3
  dio: ^5.0.0
  dartz: ^0.10.1
  flutter_screenutil: ^5.7.0
  equatable: ^2.0.5
  collection: ^1.18.0
  connectivity_plus: ^5.0.2
  internet_connection_checker: ^1.0.0+1
  
  # State Management
  mobx: ^2.2.0
  flutter_mobx: ^2.0.6+5
  
  # Storage & Security
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^8.0.0
  
  # Nice to Have
  skeletonizer: ^2.1.3
  copy_with_extension: ^5.0.0
  flutter_svg: ^2.0.9
  intl: ^0.20.2
  image_picker: ^1.0.4
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  url_launcher: ^6.2.5

  
  # Drive Module - File Management
  open_filex: ^4.3.2
  permission_handler: ^11.0.1
  media_store_plus: ^0.1.3
  device_info_plus: ^11.2.0
  photo_view: ^0.14.0
  video_player: ^2.9.1
  chewie: ^1.8.1
  
  # Wakelock fix for Xcode 16+ (fixes 'messages.g.h' not found error)
  wakelock_plus: ^1.4.0
  
  # Image Cropping & Upload
  image_cropper: ^12.2.1
  http_parser: ^4.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.6
  mobx_codegen: ^2.3.0
  copy_with_extension_gen: ^5.0.0
  
  # Launcher Icons
  flutter_launcher_icons: ^0.13.1

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/

# Configuração do ícone do app
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon4.png"
  
  # Configuração para Android - Ícone Adaptativo
  adaptive_icon_background: "#FFFFFF"  # Fundo branco
  adaptive_icon_foreground: "assets/images/app_icon3.png"
  
  # Configurações para manter o ícone centralizado (contain)
  # O ícone será redimensionado para caber sem cortar, mantendo proporções
  min_sdk_android: 21  # Android 5.0+
  
  # Remove margens para melhor centralização
  remove_alpha_ios: true
